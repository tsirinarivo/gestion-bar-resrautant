<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <linearGradient id="bgFH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="bowlFH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="rimFH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="cocktailFH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="oliveFH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </linearGradient>
    <linearGradient id="herbFH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="orangeSliceFH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="textFH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
  </defs>

  <!-- ICÔNE 200x200 à gauche -->
  <g transform="translate(20, 20)">
    <rect width="200" height="200" rx="44" fill="url(#bgFH)"/>

    <!-- Vapeur -->
    <path d="M 42 50 Q 46 40 42 30" fill="none" stroke="#EA580C" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 60 45 Q 64 33 60 22" fill="none" stroke="#EA580C" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M 76 50 Q 80 40 76 30" fill="none" stroke="#EA580C" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Bulles -->
    <circle cx="124" cy="36" r="2.7" fill="#06B6D4" opacity="0.6"/>
    <circle cx="138" cy="28" r="2.2" fill="#06B6D4" opacity="0.7"/>
    <circle cx="152" cy="34" r="2.5" fill="#06B6D4" opacity="0.55"/>
    <circle cx="164" cy="24" r="1.8" fill="#06B6D4" opacity="0.65"/>
    <circle cx="132" cy="48" r="1.6" fill="#06B6D4" opacity="0.75"/>

    <!-- Verre cocktail (martini) -->
    <g>
      <path d="M 106 60 L 172 60 L 139 113 Z" fill="white" fill-opacity="0.3" stroke="#475569" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M 110.5 65 L 167.5 65 L 139 110 Z" fill="url(#cocktailFH)"/>
      <ellipse cx="139" cy="65" rx="28" ry="2.7" fill="#FBBF24"/>

      <!-- Glaçons -->
      <rect x="125" y="68" width="11" height="11" rx="1.5" fill="white" fill-opacity="0.7"/>
      <rect x="126" y="69" width="4.5" height="4.5" fill="white" fill-opacity="0.5"/>
      <rect x="140" y="73" width="10" height="10" rx="1.5" fill="white" fill-opacity="0.6" transform="rotate(12 145 78)"/>

      <line x1="111" y1="63" x2="135" y2="106" stroke="white" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

      <!-- Tranche d'orange -->
      <g transform="translate(167, 60)">
        <path d="M 0 0 A 11 11 0 0 1 0 22 Z" fill="url(#orangeSliceFH)" stroke="#9A3412" stroke-width="1"/>
        <path d="M 0 3 A 8 8 0 0 1 0 19 Z" fill="#FED7AA" opacity="0.6"/>
        <path d="M 2 7 L 8 11 M 2 11 L 8 11 M 2 15 L 8 11" stroke="#9A3412" stroke-width="0.5" opacity="0.5"/>
      </g>

      <!-- Tige -->
      <rect x="137" y="113" width="4" height="44" fill="#475569"/>
      <ellipse cx="139" cy="161" rx="18" ry="4" fill="#334155"/>
      <ellipse cx="139" cy="160" rx="18" ry="3.5" fill="#64748B"/>

      <!-- Pic + olive -->
      <line x1="139" y1="36" x2="139" y2="72" stroke="#92400E" stroke-width="1.8" stroke-linecap="round"/>
      <ellipse cx="139" cy="44" rx="8" ry="9.5" fill="url(#oliveFH)"/>
      <ellipse cx="136" cy="41" rx="2.4" ry="3.2" fill="#BEF264" opacity="0.7"/>
      <ellipse cx="139" cy="44" rx="2" ry="3.2" fill="#DC2626"/>
    </g>

    <!-- Bowl -->
    <g>
      <ellipse cx="56" cy="112" rx="46" ry="7" fill="#7C2D12" opacity="0.4"/>
      <path d="M 10 112 A 46 46 0 0 0 102 112 Z" fill="url(#bowlFH)"/>
      <ellipse cx="56" cy="112" rx="46" ry="7.5" fill="url(#rimFH)"/>
      <ellipse cx="56" cy="109" rx="42" ry="5" fill="#5C1D08" opacity="0.75"/>
      <ellipse cx="35" cy="108" rx="15" ry="2.2" fill="white" opacity="0.65"/>

      <!-- Herbes -->
      <path d="M 40 106 Q 37 96 42 88 Q 44 94 42 105 Z" fill="url(#herbFH)"/>
      <path d="M 52 105 Q 50 92 58 86 Q 58 96 56 105 Z" fill="url(#herbFH)"/>
      <path d="M 68 106 Q 70 95 76 90 Q 74 100 72 106 Z" fill="url(#herbFH)"/>
      <!-- Cherry tomate -->
      <circle cx="82" cy="106" r="4" fill="#DC2626"/>
      <circle cx="80.5" cy="104.5" r="1.2" fill="#FCA5A5" opacity="0.8"/>

      <ellipse cx="56" cy="160" rx="30" ry="4" fill="#7C2D12" opacity="0.5"/>
    </g>

    <!-- Zeste -->
    <g transform="translate(100, 178)">
      <ellipse cx="0" cy="0" rx="8" ry="2" fill="#FBBF24" opacity="0.85"/>
      <ellipse cx="0" cy="-0.4" rx="7" ry="1.2" fill="#FDE68A"/>
    </g>
  </g>

  <!-- ============ WORDMARK + TAGLINE ============ -->
  <g transform="translate(250, 0)">
    <!-- Titre Sakafio -->
    <text x="0" y="115"
          font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="108"
          font-weight="800"
          fill="url(#textFH)"
          letter-spacing="-3">Sakafio</text>

    <!-- Point sur le i remplacé par une mini olive (clin d'œil bar) -->
    <circle cx="244" cy="49" r="7" fill="#4D7C0F"/>
    <circle cx="244" cy="49" r="2.5" fill="#DC2626"/>

    <!-- Ligne décorative -->
    <line x1="6" y1="140" x2="80" y2="140" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
    <circle cx="92" cy="140" r="3.5" fill="#EA580C"/>
    <line x1="104" y1="140" x2="180" y2="140" stroke="#EA580C" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Tagline complète -->
    <text x="6" y="178"
          font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="22"
          font-weight="600"
          fill="#7C2D12"
          letter-spacing="0.5">Logiciel pour votre restaurant et bar</text>

    <!-- Sous-tagline géolocalisée -->
    <text x="6" y="206"
          font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="14"
          font-weight="500"
          fill="#9A3412"
          letter-spacing="5"
          opacity="0.85">FAIT À MADAGASCAR · sakafio.mg</text>
  </g>
</svg>
