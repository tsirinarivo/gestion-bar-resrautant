# Zones de rate-limiting Sakafio (chargées par /etc/nginx/conf.d/).
# Doivent être au niveau http {} → c'est pour ça qu'on les met dans conf.d/
# (inclus depuis /etc/nginx/nginx.conf au niveau http) plutôt que dans
# sites-available (inclus au niveau server).

# Login API : 30 tentatives/min/IP, burst 10 avec nodelay (rejet immédiat
# au-delà, pas de queue). Bloque brute-force (>30/min suspect) mais reste
# friendly pour usage normal (équipe derrière le même NAT, oubli mdp, etc.).
# IMPORTANT : 'nodelay' évite que nginx ralentisse artificiellement les
# requêtes légitimes — sans ça, un user qui se trompe 5 fois subit 10s+
# d'attente sur ses login suivants.
limit_req_zone $binary_remote_addr zone=sakafio_login:10m rate=30r/m;

# Endpoints publics (orders, coupons, reviews) : 60 req/min/IP, burst 30.
# Complète le publicLimiter Express (50/15min) en ajoutant un floor strict.
limit_req_zone $binary_remote_addr zone=sakafio_public:10m rate=60r/m;
