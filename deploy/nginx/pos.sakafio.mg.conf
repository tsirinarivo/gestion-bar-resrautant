# pos.sakafio.mg — redirige vers le back-office unifié
# Dual server pendant la transition vers sakafio.mg

server {
    listen 80;
    listen [::]:80;
    server_name pos.sakafio.mg;
    return 301 https://admin.sakafio.mg/pos;
}

server {
    listen 80;
    listen [::]:80;
    server_name pos.restaurant.dago-it.com;
    return 301 https://admin.restaurant.dago-it.com/pos;
}
