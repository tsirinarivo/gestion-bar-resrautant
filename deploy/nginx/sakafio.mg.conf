# sakafio.mg — Application client
# Pendant la transition, écoute aussi l'ancien domaine restaurant.dago-it.com
# Une fois sakafio.mg validé et stable, retirer le 2e server_name.
# certbot --nginx complétera automatiquement le bloc SSL

server {
    listen 80;
    listen [::]:80;
    server_name sakafio.mg restaurant.dago-it.com;

    location / {
        proxy_pass         http://127.0.0.1:4005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
    }
}
