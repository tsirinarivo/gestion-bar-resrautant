# sakafio.mg — Site vitrine marketing (apps/landing)
# La page client de commande en ligne est maintenant sur shop.sakafio.mg.
# Anciennes URLs sakafio.mg/<slug>/* redirigées 301 vers shop.sakafio.mg/<slug>/*

server {
    listen 80;
    listen [::]:80;
    server_name sakafio.mg www.sakafio.mg;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rétro-compat : les anciennes URLs (QR codes, emails, etc.) pointaient
    # vers sakafio.mg/<slug>/menu, sakafio.mg/<slug>/orders, etc. — redirigées
    # vers shop.sakafio.mg pour garder le service.
    # Patterns connus : /menu, /orders, /cart, /table, /review, /account
    location ~ ^/(menu|orders|cart|table|review|account)(/.*)?$ {
        return 301 https://shop.sakafio.mg$request_uri;
    }

    # Landing vitrine Next.js (port 4008 — 4006 occupé par nexus_app sur ce VPS)
    location / {
        proxy_pass         http://127.0.0.1:4008;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
    }
}
