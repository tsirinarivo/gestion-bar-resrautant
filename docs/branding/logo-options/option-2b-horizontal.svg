<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <linearGradient id="bg2bh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="bowl2bh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="45%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="bowlRim2bh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="straw2bh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="olive2bh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </linearGradient>
    <linearGradient id="text2bh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
  </defs>

  <!-- Icône à gauche -->
  <g transform="translate(20, 20)">
    <rect width="160" height="160" rx="36" fill="url(#bg2bh)"/>

    <!-- Vapeur (cuisine) -->
    <path d="M 56 35 Q 60 26 56 18" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 70 32 Q 74 23 70 14" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- Bulles (bar) -->
    <circle cx="108" cy="28" r="3" fill="#06B6D4" opacity="0.45"/>
    <circle cx="116" cy="40" r="2.2" fill="#06B6D4" opacity="0.6"/>
    <circle cx="103" cy="44" r="1.6" fill="#06B6D4" opacity="0.55"/>

    <!-- Paille -->
    <g transform="rotate(-22 105 56)">
      <rect x="103" y="24" width="6" height="66" rx="2" fill="url(#straw2bh)"/>
      <rect x="104.3" y="27" width="1.8" height="60" rx="0.8" fill="white" opacity="0.55"/>
      <rect x="103" y="38" width="6" height="2" fill="#0E7490" opacity="0.7"/>
      <rect x="103" y="52" width="6" height="2" fill="#0E7490" opacity="0.7"/>
      <rect x="103" y="66" width="6" height="2" fill="#0E7490" opacity="0.7"/>
      <rect x="103" y="80" width="6" height="2" fill="#0E7490" opacity="0.7"/>
    </g>

    <!-- Olive -->
    <g transform="translate(118, 32)">
      <ellipse cx="0" cy="0" rx="7" ry="8" fill="url(#olive2bh)" transform="rotate(-22)"/>
      <ellipse cx="-2" cy="-2.5" rx="2" ry="2.5" fill="#A3E635" opacity="0.7" transform="rotate(-22)"/>
      <ellipse cx="0" cy="0" rx="1.8" ry="3" fill="#DC2626" transform="rotate(-22)"/>
    </g>

    <!-- Bowl -->
    <ellipse cx="80" cy="86" rx="52" ry="7" fill="#7C2D12" opacity="0.35"/>
    <path d="M 28 86 A 52 52 0 0 0 132 86 Z" fill="url(#bowl2bh)"/>
    <ellipse cx="80" cy="86" rx="52" ry="8" fill="url(#bowlRim2bh)"/>
    <ellipse cx="80" cy="84" rx="48" ry="6" fill="#7C2D12" opacity="0.7"/>
    <ellipse cx="59" cy="83" rx="16" ry="2" fill="white" opacity="0.65"/>

    <!-- Cuillère -->
    <g transform="rotate(18 56 82)">
      <rect x="42" y="62" width="3" height="28" rx="1.5" fill="#D4D4D8"/>
      <rect x="42.6" y="63" width="1.4" height="25" fill="white" opacity="0.55"/>
      <ellipse cx="43.5" cy="60" rx="5.7" ry="7" fill="#D4D4D8"/>
      <ellipse cx="43.5" cy="59" rx="3.8" ry="4.8" fill="#A1A1AA"/>
    </g>

    <!-- Base -->
    <ellipse cx="80" cy="136" rx="36" ry="4" fill="#7C2D12" opacity="0.45"/>
  </g>

  <!-- Texte "Sakafio" + tagline -->
  <g transform="translate(210, 0)">
    <text x="0" y="115"
          font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="96"
          font-weight="800"
          fill="url(#text2bh)"
          letter-spacing="-3">Sakafio</text>
    <text x="6" y="152"
          font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="17"
          font-weight="600"
          fill="#9A3412"
          letter-spacing="7">RESTAURANT &amp; BAR</text>
    <!-- Petite olive decorative séparateur -->
    <circle cx="338" cy="146" r="3" fill="#84CC16"/>
    <circle cx="338" cy="146" r="1.2" fill="#DC2626"/>
  </g>
</svg>
