<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="zafipattern" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 32 16 L 16 32 L 0 16 Z" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Fond bleu nuit -->
  <rect width="256" height="256" rx="56" fill="url(#bg3)"/>
  <rect width="256" height="256" rx="56" fill="url(#zafipattern)"/>

  <!-- Bande verticale rouge à gauche (drapeau Madagascar) -->
  <rect x="36" y="48" width="32" height="160" rx="6" fill="#FC3D32"/>
  <!-- Bande horizontale verte top -->
  <rect x="36" y="48" width="184" height="32" rx="6" fill="#00843D"/>
  <!-- Carré blanc central -->
  <rect x="84" y="96" width="112" height="112" rx="8" fill="#FAFAFA"/>

  <!-- Motif zafimaniry stylisé (losanges imbriqués) au centre du carré blanc -->
  <g transform="translate(140, 152)" stroke="#0F172A" stroke-width="2.5" fill="none">
    <path d="M 0 -36 L 28 0 L 0 36 L -28 0 Z"/>
    <path d="M 0 -22 L 18 0 L 0 22 L -18 0 Z"/>
    <path d="M 0 -10 L 8 0 L 0 10 L -8 0 Z" fill="#FC3D32" stroke="#FC3D32"/>
  </g>

  <!-- Petits triangles décoratifs aux coins du carré (motif Zafimaniry) -->
  <g fill="#00843D">
    <path d="M 92 104 L 100 104 L 96 112 Z"/>
    <path d="M 188 104 L 180 104 L 184 112 Z"/>
    <path d="M 92 200 L 100 200 L 96 192 Z"/>
    <path d="M 188 200 L 180 200 L 184 192 Z"/>
  </g>

  <!-- Petit "S" subtil en bas à droite -->
  <text x="200" y="240"
        font-family="Georgia, serif"
        font-size="22"
        font-weight="bold"
        fill="#FC3D32"
        opacity="0.7">S</text>
</svg>
