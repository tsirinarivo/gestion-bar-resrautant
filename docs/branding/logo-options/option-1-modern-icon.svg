<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Fond avec coins arrondis -->
  <rect width="256" height="256" rx="56" fill="url(#grad1)"/>

  <!-- Forme principale : "S" stylisé comme un bol/vapeur -->
  <path d="M 80 90
           Q 80 60 128 60
           Q 176 60 176 90
           Q 176 110 150 118
           L 106 130
           Q 80 138 80 158
           Q 80 188 128 188
           Q 176 188 176 158"
        fill="none"
        stroke="white"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Accent orange : trait de cuillère/lueur sous le "S" -->
  <circle cx="200" cy="200" r="14" fill="url(#accent1)"/>

  <!-- Petite vapeur stylisée au-dessus -->
  <path d="M 110 40 Q 115 32 110 24"
        fill="none"
        stroke="white"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.6"/>
  <path d="M 128 38 Q 133 30 128 22"
        fill="none"
        stroke="white"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.7"/>
  <path d="M 146 40 Q 151 32 146 24"
        fill="none"
        stroke="white"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.6"/>
</svg>
