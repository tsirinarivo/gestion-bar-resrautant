# ═══════════════════════════════════════════════════════════════════════════
# docker-compose.prod.yml — Production (VPS avec Nginx système)
# ═══════════════════════════════════════════════════════════════════════════
#
# Pattern VPS : chaque service expose sur 127.0.0.1 uniquement.
# Nginx système + Certbot gèrent le SSL et le reverse proxy.
#
#   sakafio.mg        → 127.0.0.1:4005  (client)
#   admin.sakafio.mg  → 127.0.0.1:4002  (web)
#   pos.sakafio.mg    → 127.0.0.1:4003  (pos)
#   kds.sakafio.mg    → 127.0.0.1:4004  (kds)
#   api.sakafio.mg    → 127.0.0.1:4001  (api)
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: restaurant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_db}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - restaurant_internal
      - restaurant_shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurant_user} -d ${POSTGRES_DB:-restaurant_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── PostgreSQL Backup ──────────────────────────────────────────────────────
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: restaurant_postgres_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_db}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z9 --schema=public --blobs"
      SCHEDULE: "0 3 * * *"          # every day at 03:00 (server time)
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 12
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restaurant_internal

  # ── Watchdog (rapporte les pannes API + alertes Discord optionnelles) ──────
  watchdog:
    image: alpine:3.20
    container_name: restaurant_watchdog
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./deploy/watchdog.sh:/watchdog.sh:ro
      - ./logs:/logs
    command: ["sh", "/watchdog.sh"]
    networks:
      - restaurant_internal

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: restaurant_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - restaurant_internal
      - restaurant_shared
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: restaurant_api:latest
    container_name: restaurant_api
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-restaurant_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "127.0.0.1:4001:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/public/uploads
    networks:
      - restaurant_internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Web (Back-office manager) ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    image: restaurant_web:latest
    container_name: restaurant_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:4002:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - restaurant_internal

  # ── POS ────────────────────────────────────────────────────────────────────
  pos:
    build:
      context: .
      dockerfile: apps/pos/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    image: restaurant_pos:latest
    container_name: restaurant_pos
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:4003:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - restaurant_internal

  # ── KDS ────────────────────────────────────────────────────────────────────
  kds:
    build:
      context: .
      dockerfile: apps/kds/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    image: restaurant_kds:latest
    container_name: restaurant_kds
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:4004:3002"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - restaurant_internal

  # ── Client (commande en ligne) ─────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    image: restaurant_client:latest
    container_name: restaurant_client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:4005:3003"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - restaurant_internal

  # ── Migration runner (one-shot) ────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: restaurant_api:latest
    container_name: restaurant_migrate
    restart: "no"
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-restaurant_db}
    command: ["sh", "-c", "npx prisma db push && node dist/seed.js || true"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restaurant_internal
    profiles:
      - migrate

  # ── Master Console (gestion des tenants SaaS) ──────────────────────────────
  master:
    build:
      context: .
      dockerfile: apps/master/Dockerfile
    image: restaurant_master:latest
    container_name: restaurant_master
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: "0.0.0.0"
      MASTER_DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD}@postgres:5432/${MASTER_DB_NAME:-master_db}
      MASTER_JWT_SECRET: ${MASTER_JWT_SECRET}
      RESTAURANT_ROOT: /opt/restaurant
    ports:
      - "127.0.0.1:4010:3010"
    volumes:
      # Accès Docker socket pour lancer/stopper les stacks tenants
      - /var/run/docker.sock:/var/run/docker.sock
      # Accès au répertoire du projet pour exécuter les scripts de provisioning
      - /opt/restaurant:/opt/restaurant
      # Écriture des configs Nginx tenant (reload manuel après création)
      - /etc/nginx/sites-available:/etc/nginx/sites-available
      - /etc/nginx/sites-enabled:/etc/nginx/sites-enabled
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restaurant_internal

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  restaurant_internal:
    driver: bridge
    name: restaurant_internal
  # Network partagé avec les stacks tenants (créé par deploy/new-tenant.sh).
  # Permet aux containers tenants de joindre postgres + redis du master.
  restaurant_shared:
    external: true
    name: restaurant_shared
